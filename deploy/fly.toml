app = "sicar-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SICAR_DATA_DIR = "/data/sicar"
  SICAR_ALLOWED_HOSTS = "sicar-mcp.fly.dev"
  SICAR_MEMORY_LIMIT = "1200MB"
  SICAR_THREADS = "2"
  SICAR_QUERY_TIMEOUT = "40"
  SICAR_RATE_PER_MIN = "40"

[mounts]
  source = "sicardata"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
