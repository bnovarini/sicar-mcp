[project]
name = "sicar-mcp"
version = "0.1.0"
description = "Brazil CAR (Cadastro Ambiental Rural) property perimeters as MCP tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["duckdb>=1.1", "mcp>=1.2,<2", "uvicorn"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
